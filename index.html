<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- This meta tag makes the app look good on mobile phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafeteria Booking</title>
  </head>
  <body>
    <!--
      React mounts the entire app inside this single div.
      The whole website is rendered by JavaScript into this one element.
    -->
    <div id="root"></div>
    <!--
      type="module" tells the browser this is modern JavaScript.
      Vite processes main.jsx and all its imports.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
